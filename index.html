<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>邪馬台国マインスイーパー</title>
  <meta name="description" content="旧国名の地図で遊ぶマインスイーパー。卑弥呼のお宝を掘り当てずに、すべての国を調べ尽くせ。">
  <meta name="theme-color" content="#2a1d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M38 8a22 22 0 1 1-24 30c8 4 18 0 18-9s-8-11-12-11a20 20 0 0 1 18-10z' fill='%23c0392b'/%3E%3Ccircle cx='38' cy='22' r='5' fill='%23fff3d6'/%3E%3C/svg%3E">
</head>
<body>
  <!-- お宝アイコン -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="gGold" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#e3b23c"/><stop offset="1" stop-color="#8a5a12"/></radialGradient>
      <radialGradient id="gJade" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#b9f5d0"/><stop offset=".5" stop-color="#2e9e6b"/><stop offset="1" stop-color="#0d4a32"/></radialGradient>
      <radialGradient id="gBronze" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#d9f0e4"/><stop offset=".55" stop-color="#5fa38a"/><stop offset="1" stop-color="#2b5547"/></radialGradient>
      <radialGradient id="gPearl" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#efe6f5"/><stop offset="1" stop-color="#b9a7c7"/></radialGradient>
    </defs>
    <symbol id="i-magatama" viewBox="-20 -20 40 40">
      <path d="M2-16a15 15 0 1 1-14 22c6 3 14 0 14-7s-6-9-9-9a14 14 0 0 1 9-6z" fill="url(#gJade)" stroke="#0b3324" stroke-width="1.2"/>
      <circle cx="3" cy="-6" r="3.4" fill="#fdf6e3" stroke="#0b3324" stroke-width="1"/>
    </symbol>
    <symbol id="i-kinin" viewBox="-20 -20 40 40">
      <rect x="-13" y="-4" width="26" height="16" rx="2" fill="url(#gGold)" stroke="#6b4310" stroke-width="1.2"/>
      <path d="M-7-4c0-8 3-12 7-12s7 4 7 12z" fill="url(#gGold)" stroke="#6b4310" stroke-width="1.2"/>
      <circle cx="-2" cy="-11" r="1.2" fill="#6b4310"/>
      <text x="0" y="9" text-anchor="middle" font-size="9" fill="#6b4310" font-weight="700">王</text>
    </symbol>
    <symbol id="i-kagami" viewBox="-20 -20 40 40">
      <circle r="16" fill="url(#gBronze)" stroke="#1f3d33" stroke-width="1.4"/>
      <circle r="11.5" fill="none" stroke="#1f3d33" stroke-width="1" stroke-dasharray="2 2"/>
      <circle r="7" fill="none" stroke="#1f3d33" stroke-width="1"/>
      <circle r="3" fill="#c9a24a" stroke="#1f3d33" stroke-width="1"/>
    </symbol>
    <symbol id="i-nishiki" viewBox="-20 -20 40 40">
      <path d="M-15-12h30v22c-5 4-10-2-15 2s-10-2-15 2z" fill="#a8243a" stroke="#4d0f19" stroke-width="1.2"/>
      <path d="M-15-5h30M-15 3h30" stroke="#e3b23c" stroke-width="2"/>
      <path d="M-10-12l4 7 4-7 4 7 4-7 4 7" fill="none" stroke="#f5e6c4" stroke-width="1.1"/>
      <circle cx="-7" cy="7" r="1.6" fill="#f5e6c4"/><circle cx="3" cy="7" r="1.6" fill="#f5e6c4"/>
    </symbol>
    <symbol id="i-katana" viewBox="-20 -20 40 40">
      <path d="M-14 14L12-12" stroke="#d7dde3" stroke-width="4" stroke-linecap="round"/>
      <path d="M-14 14L12-12" stroke="#5c6670" stroke-width="1" />
      <circle cx="11" cy="-11" r="5" fill="none" stroke="#b8862b" stroke-width="2.2"/>
      <path d="M-11 6l5 5" stroke="#3d2412" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-shinju" viewBox="-20 -20 40 40">
      <path d="M-16 8a16 10 0 0 0 32 0z" fill="#8c6a4a" stroke="#3d2a1a" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="10" fill="url(#gPearl)" stroke="#7d6b8c" stroke-width="1"/>
      <circle cx="-3" cy="-4" r="2.5" fill="#fff" opacity=".9"/>
    </symbol>
    <symbol id="i-dotaku" viewBox="-20 -20 40 40">
      <path d="M-5-17h10l2 6h-14z" fill="url(#gBronze)" stroke="#1f3d33" stroke-width="1"/>
      <path d="M-8-11h16l5 26h-26z" fill="url(#gBronze)" stroke="#1f3d33" stroke-width="1.3"/>
      <path d="M-9-3h18M-11 5h22" stroke="#1f3d33" stroke-width="1" stroke-dasharray="2 1.5"/>
    </symbol>
    <symbol id="i-kudatama" viewBox="-20 -20 40 40">
      <path d="M-15 0q15-14 30 0" fill="none" stroke="#7a4a1f" stroke-width="1"/>
      <rect x="-14" y="-4" width="7" height="12" rx="3" fill="url(#gJade)" stroke="#0b3324" transform="rotate(-25 -10 2)"/>
      <rect x="-3.5" y="-8" width="7" height="13" rx="3" fill="url(#gJade)" stroke="#0b3324"/>
      <rect x="7" y="-4" width="7" height="12" rx="3" fill="url(#gJade)" stroke="#0b3324" transform="rotate(25 10 2)"/>
    </symbol>
    <!-- 旗（同盟国だと思う国に立てる） -->
    <symbol id="i-mark" viewBox="-20 -20 40 40">
      <ellipse cx="-4" cy="15" rx="11" ry="3.2" fill="#3d2412" opacity=".55"/>
      <rect x="-7" y="-17" width="3" height="32" rx="1.2" fill="#5a3a1c" stroke="#2a1a0c" stroke-width=".8"/>
      <path d="M-4-16C2-18 7-12 15-14L12-6 15 2C7 4 2-2-4 0z" fill="#d6372a" stroke="#6e1a12" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="-5.5" cy="-17.5" r="2.2" fill="#e3b23c" stroke="#6b4310" stroke-width=".8"/>
    </symbol>
    <!-- スコップ（掘る） -->
    <symbol id="i-shovel" viewBox="-20 -20 40 40">
      <g transform="rotate(35)">
        <rect x="-1.8" y="-17" width="3.6" height="19" rx="1.2" fill="#8a5a2b" stroke="#3d2412" stroke-width="1"/>
        <rect x="-6.5" y="-19" width="13" height="4.5" rx="2.2" fill="#8a5a2b" stroke="#3d2412" stroke-width="1"/>
        <path d="M-8 1H8V9C8 15 4 19 0 20C-4 19-8 15-8 9z" fill="#aab4bc" stroke="#3f474e" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M-4 4V11" stroke="#e8eef2" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </symbol>
  </svg>

  <div id="app">
    <header class="top">
      <h1><span class="t-small" data-i18n="head.sub">卑弥呼のお宝さがし</span><span class="t-main" data-i18n="head.main">邪馬台国</span><span class="t-sub" data-i18n="head.main2">マインスイーパー</span></h1>
      <div class="stats">
        <div class="stat"><span class="lbl" data-i18n="stat.left">残りのお宝</span><span id="st-left" class="val">0</span></div>
        <div class="stat"><span class="lbl" data-i18n="stat.try">挑戦</span><span id="st-try" class="val">1回目</span></div>
        <div class="stat"><span class="lbl" data-i18n="stat.time">時</span><span id="st-time" class="val">0:00</span></div>
      </div>
      <div class="tools">
        <button id="btn-zoom" class="icon-btn" data-i18n-title="tool.zoom" title="拡大・縮小">🔍</button>
        <button id="btn-bgm" class="icon-btn on" data-i18n-title="tool.bgm" title="BGM">🎵</button>
        <button id="btn-sfx" class="icon-btn on" data-i18n-title="tool.sfx" title="効果音">🔔</button>
        <button id="btn-help" class="icon-btn" data-i18n-title="tool.help" title="遊び方">？</button>
        <button id="btn-menu" class="icon-btn" data-i18n-title="tool.menu" title="トップに戻る">巻</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="mode" role="group" aria-label="操作の切り替え">
        <button id="btn-dig" class="mode-btn on" aria-pressed="true" data-i18n-html="mode.dig"><svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><use href="#i-shovel" width="40" height="40"/></svg> 掘る</button>
        <button id="btn-mark" class="mode-btn" aria-pressed="false" data-i18n-html="mode.mark"><svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><use href="#i-mark" width="40" height="40"/></svg> 旗を立てる</button>
      </div>
    </div>

    <main id="board-wrap">
      <svg id="board" role="grid" aria-label="旧国名の地図"></svg>
      <div id="toast" aria-live="polite"></div>
    </main>

    <footer class="hint" data-i18n="hint"></footer>
  </div>

  <!-- タイトル -->
  <div id="title" class="overlay show">
    <div class="scroll">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">English</button>
      </div>
      <div class="seal">卑</div>
      <h2 data-i18n-html="title.h">邪馬台国<br>マインスイーパー</h2>
      <p class="catch" data-i18n="title.catch">卑弥呼の同盟国を探し出せ！</p>
      <div class="levels">
        <button class="level" data-mines="6"><b>易</b><small>同盟国 6</small></button>
        <button class="level" data-mines="9"><b>中</b><small>同盟国 9</small></button>
        <button class="level" data-mines="12"><b>難</b><small>同盟国 12</small></button>
      </div>
      <button class="secondary" id="title-help" data-i18n="title.help">あそびかた</button>
      <p class="best" id="best"></p>
      <div id="legal" hidden>
        <span id="buildInfo"></span>
        <a href="https://techgym.jp/privacy-policy/" data-i18n-href="url.privacy" data-i18n="legal.privacy" target="_blank" rel="noopener">プライバシーポリシー</a>
        <span id="adPrivacy" hidden>｜<a href="#" id="adPrivacyLink" data-i18n="legal.ads">広告の設定</a></span>
      </div>
    </div>
  </div>

  <!-- ポーズ -->
  <div id="pause" class="overlay">
    <div class="scroll">
      <div class="seal">休</div>
      <h2 data-i18n="pause.h">ひと休み</h2>
      <p data-i18n="pause.p">時は止まっています。</p>
      <div class="res-btns">
        <button class="primary" id="pause-resume" data-i18n="pause.resume">再開する</button>
        <button class="secondary" id="pause-top" data-i18n="pause.top">トップに戻る</button>
      </div>
    </div>
  </div>

  <!-- リワード広告：掘り当てる前に戻る -->
  <div id="redo" class="redo" hidden>
    <p class="redo-title" data-i18n="redo.title">お宝を掘り当ててしまった…</p>
    <button class="primary" id="redo-watch">広告を見て、掘る前に戻る</button>
    <p class="redo-note" id="redo-note"></p>
    <button class="redo-skip" id="redo-skip">振り出しに戻る</button>
  </div>

  <!-- 遊び方 -->
  <div id="help" class="overlay">
    <div class="scroll">
      <h2 data-i18n="help.h">遊び方</h2>
      <p class="lead" data-i18n-html="title.lead"></p>
      <div class="treasure-row" id="help-treasures"></div>
      <p class="warn" data-i18n-html="title.warn"></p>
      <ol class="rules" data-i18n-html="help.rules"></ol>
      <p class="small" data-i18n="help.small"></p>
      <button class="primary" data-close data-i18n="help.ok">わかった</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="result" class="overlay">
    <div class="scroll">
      <div class="seal" id="res-seal">失</div>
      <h2 id="res-title"></h2>
      <p id="res-text"></p>
      <div class="treasure-row" id="res-treasures"></div>
      <div class="res-btns">
        <button class="primary" id="res-next">もう一度</button>
        <button class="secondary" id="res-menu" data-i18n="res.top">トップに戻る</button>
      </div>
      <div class="share-row" id="res-share-row">
        <button class="share-btn main" id="res-share" data-i18n="res.share">📤 結果をシェア</button>
        <!-- web-only -->
        <div class="share-sub" id="share-sub" hidden>
          <a class="share-btn" id="share-x" target="_blank" rel="noopener" data-i18n="share.x">𝕏 ポスト</a>
          <a class="share-btn" id="share-line" target="_blank" rel="noopener">LINE</a>
        </div>
        <!-- /web-only -->
      </div>
    </div>
  </div>

  <script src="js/build-info.js"></script>
  <script src="js/ads-config.js"></script>
  <script src="js/ads.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
